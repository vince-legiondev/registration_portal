{% extends "templates/web.html" %}

{% block page_content %}

<style>
    /* =========================================================
       REGISTRATION PROGRAM PAGE
       Hide Frappe's standard navbar and footer only on this page
       ========================================================= */

    body.registration-program-page .navbar {
        display: none !important;
    }

    body.registration-program-page .web-footer {
        display: none !important;
    }

    /* Some Frappe templates use footer instead of .web-footer */
    body.registration-program-page footer {
        display: none !important;
    }

    /* Remove spacing left by website layout */
    body.registration-program-page main {
        padding-top: 0 !important;
        margin-top: 0 !important;
    }

    body.registration-program-page .page-content-wrapper {
        margin-top: 0 !important;
        padding-top: 0 !important;
    }

    body.registration-program-page .page_content {
        margin-top: 0 !important;
        padding-top: 0 !important;
    }

    body.registration-program-page .web-page-content {
        padding-top: 0 !important;
    }

    /* Optional: cleaner standalone registration page */
    body.registration-program-page {
        background: #ffffff;
    }

    .registration-program-container {
        max-width: 1100px;
        margin: 0 auto;
        padding-top: 60px;
        padding-bottom: 60px;
    }

    .registration-program-card {
        border-radius: 12px;
        overflow: hidden;
        height: 100%;
    }

    .registration-program-card .card-body {
        padding: 24px;
    }

    .registration-program-card .card-title {
        font-weight: 600;
        margin-bottom: 12px;
    }

    .registration-fee {
        font-size: 1.25rem;
    }
</style>


<div class="container registration-program-container">

    <div class="mb-4">

        <h2>
            Registration Programs
        </h2>

        <p class="text-muted">
            Select a program to continue with your registration.
        </p>

    </div>


    <div
        id="program-list"
        class="row"
    >

        <div class="col-12">

            <p>
                Loading registration programs...
            </p>

        </div>

    </div>

</div>


<script>

frappe.ready(() => {

    /*
     * Add a page-specific class to the body.
     *
     * This allows us to hide the navbar/footer only here
     * without affecting the rest of the Frappe website.
     */
    document.body.classList.add(
        "registration-program-page"
    );


    /*
     * Frappe may render some website elements after the
     * page content. Explicitly hide them as a fallback.
     */
    hideFrappeWebsiteElements();


    loadPrograms();

});


function hideFrappeWebsiteElements() {

    const navbarSelectors = [
        ".navbar",
        ".web-navbar",
        "header.navbar"
    ];

    const footerSelectors = [
        ".web-footer",
        "footer"
    ];


    navbarSelectors.forEach(selector => {

        document
            .querySelectorAll(selector)
            .forEach(element => {

                element.style.setProperty(
                    "display",
                    "none",
                    "important"
                );

            });

    });


    footerSelectors.forEach(selector => {

        document
            .querySelectorAll(selector)
            .forEach(element => {

                element.style.setProperty(
                    "display",
                    "none",
                    "important"
                );

            });

    });

}


function loadPrograms() {

    frappe.call({

        method:
            "registration_portal.registration_portal.api.get_registration_programs",

        callback(r) {

            const container =
                document.getElementById(
                    "program-list"
                );


            if (
                !r.message
                || r.message.length === 0
            ) {

                container.innerHTML = `
                    <div class="col-12">

                        <div class="alert alert-info">
                            There are currently no registration programs available.
                        </div>

                    </div>
                `;

                return;
            }


            container.innerHTML = "";


            r.message.forEach(program => {

                const wrapper =
                    document.createElement(
                        "div"
                    );


                wrapper.className =
                    "col-md-6 col-lg-4 mb-4";


                wrapper.innerHTML =
                    buildProgramCard(
                        program
                    );


                container.appendChild(
                    wrapper
                );

            });

        },


        error() {

            const container =
                document.getElementById(
                    "program-list"
                );


            container.innerHTML = `
                <div class="col-12">

                    <div class="alert alert-danger">
                        Unable to load registration programs.
                    </div>

                </div>
            `;

        }

    });

}


function buildProgramCard(program) {

    const fee =
        Number(
            program.registration_fee || 0
        ).toLocaleString(
            "en-PH",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );


    const endDate =
        program.registration_end
            ? formatDate(
                program.registration_end
            )
            : null;


    return `

        <div
            class="
                card
                registration-program-card
            "
        >

            <div
                class="
                    card-body
                    d-flex
                    flex-column
                "
            >

                <h4 class="card-title">

                    ${escapeHtml(
                        program.program_name
                    )}

                </h4>


                ${
                    program.description
                        ? `

                            <div
                                class="
                                    text-muted
                                    mb-3
                                "
                            >

                                ${program.description}

                            </div>

                        `
                        : ""
                }


                <div class="mt-auto">

                    <div class="mb-2">

                        <strong>
                            Registration Fee
                        </strong>


                        <div class="registration-fee">

                            ${escapeHtml(
                                program.currency
                            )}

                            ${fee}

                        </div>

                    </div>


                    ${
                        endDate
                            ? `

                                <div
                                    class="
                                        text-muted
                                        small
                                        mb-3
                                    "
                                >

                                    Registration until:

                                    ${escapeHtml(
                                        endDate
                                    )}

                                </div>

                            `
                            : ""
                    }


                    <button
                        type="button"
                        class="
                            btn
                            btn-primary
                            w-100
                        "
                        data-program-name="${escapeHtml(
                            program.name
                        )}"
                        onclick="selectProgram(this)"
                    >

                        Register

                    </button>

                </div>

            </div>

        </div>

    `;

}


function selectProgram(button) {

    const programName =
        button.dataset.programName;


    if (!programName) {
        return;
    }


    window.location.href =
        "/register-form/new?program="
        + encodeURIComponent(
            programName
        );

}


function formatDate(value) {

    const date =
        new Date(
            value
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return value;

    }


    return date.toLocaleDateString(
        "en-PH",
        {
            year: "numeric",
            month: "long",
            day: "numeric"
        }
    );

}


function escapeHtml(value) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value == null
            ? ""
            : String(value);


    return div.innerHTML;

}

</script>

{% endblock %}
