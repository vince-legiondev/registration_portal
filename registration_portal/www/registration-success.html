{% extends "templates/web.html" %}

{% block page_content %}

<div
    class="container"
    style="
        max-width: 700px;
        margin: 80px auto;
        text-align: center;
    "
>
    <h2 id="status-title">
        Confirming Registration
    </h2>

    <p id="status-message">
        Please wait while we confirm your registration.
    </p>

    <div
        id="registration-details"
        style="
            display: none;
            margin-top: 30px;
            text-align: left;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
        "
    >
        <p>
            <strong>Registration:</strong>
            <span id="registration"></span>
        </p>

        <p>
            <strong>Program:</strong>
            <span id="program"></span>
        </p>

        <p>
            <strong>Registration Fee:</strong>
            Free
        </p>
    </div>

    <div
        id="actions"
        style="
            display: none;
            margin-top: 25px;
        "
    >
        <a
            href="/register"
            class="btn btn-primary"
        >
            Back to Registration Programs
        </a>
    </div>
</div>


<script>

frappe.ready(() => {
    const token =
        new URLSearchParams(
            window.location.search
        ).get("token");

    if (!token) {
        showError(
            "Registration information could not be found."
        );

        return;
    }

    checkRegistration(token);
});


function checkRegistration(token) {
    frappe.call({
        method:
            "registration_portal.registration_portal.api.get_registration_payment_status",

        args: {
            payment_token: token
        },

        callback(r) {
            if (!r.message) {
                showError(
                    "Unable to confirm registration."
                );

                return;
            }

            const data =
                r.message;

            if (data.payment_status === "Paid") {
                window.location.href =
                    "/payment-success?token="
                    + encodeURIComponent(
                        token
                    );

                return;
            }

            if (data.payment_status !== "Free") {
                window.location.href =
                    "/registration-payment?token="
                    + encodeURIComponent(
                        token
                    );

                return;
            }

            showDetails(data);
            showSuccess();
        },

        error() {
            showError(
                "Unable to confirm registration."
            );
        }
    });
}


function showDetails(data) {
    document.getElementById(
        "registration-details"
    ).style.display =
        "block";

    document.getElementById(
        "registration"
    ).innerText =
        data.registration || "";

    document.getElementById(
        "program"
    ).innerText =
        data.program || "";
}


function showSuccess() {
    document.getElementById(
        "status-title"
    ).innerText =
        "Registration Successful";

    document.getElementById(
        "status-message"
    ).innerText =
        "Your registration has been confirmed. No payment is required for this program.";

    document.getElementById(
        "actions"
    ).style.display =
        "block";
}


function showError(message) {
    document.getElementById(
        "status-title"
    ).innerText =
        "Unable to Confirm Registration";

    document.getElementById(
        "status-message"
    ).innerText =
        message;

    document.getElementById(
        "actions"
    ).style.display =
        "block";
}

</script>

{% endblock %}
